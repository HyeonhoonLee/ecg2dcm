[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "XML2DCM-ECG"
version = "1.2.0"
description = "Convert GE MUSE XML electrocardiogram files to DICOM 12-Lead ECG Waveform Storage"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MedxEng", email = "eunbyul616@gmail.com" }]
keywords = ["ECG", "DICOM", "GE MUSE", "electrocardiogram", "waveform", "interoperability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["pydicom==2.4.4", "numpy", "tqdm"]

[project.urls]
Homepage = "https://github.com/MedxEng/XML2DCM-ECG"
Repository = "https://github.com/MedxEng/XML2DCM-ECG"
Issues = "https://github.com/MedxEng/XML2DCM-ECG/issues"

[project.scripts]
xml2dcm-ecg = "xml2dcm.main:main"

[tool.hatch.build.targets.wheel]
packages = ["xml2dcm"]
